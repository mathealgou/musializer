name: no-build build
on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Clone GIT repo
        uses: actions/checkout@v4
      - name: Build nob
        run: clang -o nob nob.c
      - name: Run nob
        run: ./nob
      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-folder
          path: build/
      - name: Package release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          brew install imagemagick
          ./nob dist
          ditto -c -k --sequesterRsrc --keepParent build/Musializer.app musializer-macos.zip
      - name: Upload release package
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: musializer-macos.zip
  ubuntu:
    strategy:
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - name: Clone GIT repo
        uses: actions/checkout@v4
      - name: Pull Deps
        run: sudo apt install xorg-dev
      - name: Build nob
        run: ${{ matrix.cc }} -o nob nob.c
      - name: Run nob
        run: ./nob
      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.cc }}-build-folder
          path: build/
      - name: Package release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && matrix.cc == 'gcc'
        run: ./nob dist
      - name: Upload release package
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && matrix.cc == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: musializer-linux-x86_64.tar.gz
  windows:
    name: windows (${{ matrix.hotreload == true && 'hotreload' || '' }})
    runs-on: windows-latest
    strategy:
      matrix:
        hotreload: [true, false]
    steps:
      - name: Clone GIT repo
        uses: actions/checkout@v4
      - name: Build nob
        shell: cmd
        # cl.exe isn't available as-is in Github images because they don't want
        # to, so we need to pull env vars ourselves. Refs:
        # https://github.com/actions/runner-images/issues/6205#issuecomment-1241573412
        # https://learn.microsoft.com/en-us/cpp/build/building-on-the-command-line?view=msvc-170#create-your-own-command-prompt-shortcut
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl.exe /Fenob nob.c
      - name: Run nob
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          nob.exe config ${{ matrix.hotreload == true && 'hotreload' || '' }}
          nob.exe
      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.hotreload == true && 'hotreload' || '' }}-build-folder
          path: build/
      # `nob dist` is not implemented for the MSVC target, so package by hand
      - name: Package release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && matrix.hotreload == false
        shell: pwsh
        run: |
          New-Item -ItemType Directory musializer-win64
          Copy-Item build/musializer.exe musializer-win64/
          Copy-Item -Recurse resources musializer-win64/resources
          Copy-Item musializer-logged.bat musializer-win64/
          Compress-Archive -Path musializer-win64 -DestinationPath musializer-win64.zip
      - name: Upload release package
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && matrix.hotreload == false
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: musializer-win64.zip
  release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [macos, ubuntu, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on the pushed commit if it doesn't exist yet
          tag_name: v0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
